spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB



# Hibernate needs to know what dialect to use before the database metadata is available.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
# Database configuration (override in environment-specific property files or via CLI)
spring.datasource.url=${TAVALL_COURIERS_DB_URL:jdbc:postgresql://localhost:5432/tavall}
spring.datasource.username=${TAVALL_COURIERS_DB_USERNAME:novus}
spring.datasource.password=${TAVALL_COURIERS_DB_PASSWORD:}
tavall.client.dev-login.enabled=true
