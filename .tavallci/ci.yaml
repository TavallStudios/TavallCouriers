version: 2

source:
  repository: TavallStudios/TavallCouriers
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

modules:
  - gemini-api
  - internal-courier-api
  - spring-webview

dependencies:
  - kind: source
    identity: TavallStudios/tavall-cache
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-concurrency
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-database
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-di
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-eventbus
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-logging
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-reflection
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-registry
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-scheduler
    role: SHARED_DEP
    selector: required-source

artifacts:
  - name: tavall-couriers-runtime
    path: spring-webview/build/libs/tavall-couriers.jar
  - name: tavall-couriers-gemini-api-lockfile
    path: gemini-api/gradle.lockfile
  - name: tavall-couriers-internal-api-lockfile
    path: internal-courier-api/gradle.lockfile
  - name: tavall-couriers-spring-webview-lockfile
    path: spring-webview/gradle.lockfile

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - "clean"
      - ":gemini-api:clean"
      - ":internal-courier-api:clean"
      - ":spring-webview:clean"
      - "check"
      - ":gemini-api:check"
      - ":internal-courier-api:check"
      - ":spring-webview:check"
      - "assemble"
      - ":gemini-api:assemble"
      - ":internal-courier-api:assemble"
      - ":spring-webview:assemble"

  dependencies:
    executor: gradle
    writeDependencyLocks: true
    includeInAll: false
    tasks:
      - "clean"
      - ":gemini-api:clean"
      - ":internal-courier-api:clean"
      - ":spring-webview:clean"
      - "check"
      - ":gemini-api:check"
      - ":internal-courier-api:check"
      - ":spring-webview:check"
      - "assemble"
      - ":gemini-api:assemble"
      - ":internal-courier-api:assemble"
      - ":spring-webview:assemble"
